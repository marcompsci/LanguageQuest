# Language Quest release gate. Runs on every push and pull request.
# A failing or skipped job blocks the gate: no step uses continue-on-error.
name: Release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older run of the same branch (saves macOS minutes).
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Compliance checks (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apple compliance gate
        run: python3 scripts/compliance-check.py

  core-tests:
    name: LQCore unit tests + content checks
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (includes content validation and compliance regressions)
        working-directory: Packages/LQCore
        run: swift test
      - name: Generated content matches the authoring scripts
        run: |
          apt-get update -qq && apt-get install -y -qq python3 git >/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          C=Packages/LQCore/Sources/LQCore/Resources/Content
          T=tools/content-authoring
          python3 $T/course.py $C/en-es && python3 $T/unit1.py $C/en-es && python3 $T/unit2.py $C/en-es && python3 $T/unit3.py $C/en-es
          python3 $T/fr.py $C/en-fr && python3 $T/ja.py $C/en-ja
          python3 $T/starter.py $C Packages/LQCore/Sources/LQCore/World/VillageWords+Generated.swift
          git diff --exit-code -- $C Packages/LQCore/Sources/LQCore/World/VillageWords+Generated.swift

  ios:
    name: iOS build, analyze, UI tests
    runs-on: macos-15
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      # The committed LanguageQuest.xcodeproj is built as-is (it is generated with XcodeGen 2.42.0;
      # newer XcodeGen versions format the file differently). A missing source file fails the build below,
      # and version/build drift is caught by the compliance gate.
      - name: Release build for device (unsigned)
        run: |
          xcodebuild -project LanguageQuest.xcodeproj -scheme LanguageQuest -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
              grep -E "error:|\*\* BUILD" build.log | sort -u | head -60; exit 1; }
          tail -n 5 build.log
      - name: Static analysis
        run: |
          xcodebuild -project LanguageQuest.xcodeproj -scheme LanguageQuest -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO analyze | tee analyze.log | tail -n 40
          if grep -q "warning: .*\[.*Analyzer" analyze.log; then echo "Static analyzer found issues"; exit 1; fi
      - name: UI tests (iPhone simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          # Boot first and wait: a cold simulator often times out with "AX loaded notification".
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          run_tests() {
            xcodebuild -project LanguageQuest.xcodeproj -scheme LanguageQuest -destination "id=$UDID" \
              -resultBundlePath "UITests-$1.xcresult" test > "ui-$1.log" 2>&1
            local rc=$?
            grep -E "Test Case .*(passed|failed)|error:|AUDIT-ISSUE|\*\* TEST" "ui-$1.log" || true
            return $rc
          }
          # One retry only for runner start-up failures; a real test failure fails both attempts and the job.
          set +e
          run_tests 1; rc=$?
          # Retry once only when every error is a simulator/launch failure, never for a failed assertion.
          INFRA='failed to initialize for UI testing|AX loaded notification|Failed to launch|background assertion|Simulator device failed|Application .* is not running'
          if [ $rc -ne 0 ]; then
            real=$(grep -E "error:" ui-1.log | grep -vE "$INFRA" | wc -l | tr -d ' ')
            if [ "$real" = "0" ]; then
              echo "::warning::Only simulator/launch failures; rebooting the simulator and retrying once"
              xcrun simctl shutdown "$UDID" || true; xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
              run_tests 2; rc=$?
            fi
          fi
          exit $rc
      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            UITests-*.xcresult
            ui-*.log
          if-no-files-found: ignore
