# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: LanguageQuest
options:
  bundleIdPrefix: com.phoronomics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: X6LZQ3FS36
packages:
  LQCore:
    path: Packages/LQCore
targets:
  LanguageQuest:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LQCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.languagequest
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Language Quest
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # No encryption: the only crypto is a SHA-256 hash of the parent PIN (hashing is exempt).
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Only if a grown-up turns on speech practice: the microphone listens after you tap the talk button, until you tap “I’m done” or finish speaking, so the app can check your pronunciation. Audio is processed on this device and never saved or sent."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID can confirm you are the device owner if you forget the Language Quest parent PIN."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech practice uses on-device recognition only. Your voice never leaves this device and is not stored."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  LanguageQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LanguageQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.languagequest.uitests
        TEST_TARGET_NAME: LanguageQuest
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LanguageQuest:
    build:
      targets:
        LanguageQuest: all
        LanguageQuestUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/LanguageQuest.storekit
    test:
      config: Debug
      targets:
        - LanguageQuestUITests
