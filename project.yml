# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: LanguageQuest
options:
  bundleIdPrefix: com.phoronomics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID
packages:
  LQCore:
    path: Packages/LQCore
targets:
  LanguageQuest:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LQCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.languagequest
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Language Quest
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Only if a grown-up turns on speech practice: the microphone listens while you hold the talk button so the app can check your Spanish. Audio is processed on this device and never saved or sent."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech practice uses on-device recognition only. Your voice never leaves this device and is not stored."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  LanguageQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: LanguageQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phoronomics.languagequest.uitests
        TEST_TARGET_NAME: LanguageQuest
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LanguageQuest:
    build:
      targets:
        LanguageQuest: all
        LanguageQuestUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/LanguageQuest.storekit
    test:
      config: Debug
      targets:
        - LanguageQuestUITests
